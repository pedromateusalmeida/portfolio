{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <!-- Open Graph / WhatsApp / LinkedIn Preview Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Portfólio Pedro Almeida — Cientista de Dados" />
  <meta property="og:description" content="Portfólio profissional de Pedro Almeida — Cientista de Dados com experiência em Modelagem, Model Risk Management (MRM), Governança de IA, MLOps, Engenharia de Dados e Estatística Computacional (UFMG)." />
  <meta property="og:image" content="https://pedromateusalmeida.github.io/portfolio/my_pic.png" />
  <meta property="og:image:secure_url" content="https://pedromateusalmeida.github.io/portfolio/my_pic.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:url" content="https://pedromateusalmeida.github.io/portfolio/" />

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portfólio Pedro Almeida — Cientista de Dados" />
  <meta name="twitter:description" content="Portfólio profissional de Pedro Almeida — Cientista de Dados com experiência em Modelagem, MRM, Governança de IA e MLOps." />
  <meta name="twitter:image" content="https://pedromateusalmeida.github.io/portfolio/my_pic.png" />
{% endblock %}

{% block content %}
  <!-- Botão Discreto de Idioma PT | EN -->
  <div class="lang-switcher">
    <button onclick="changeSiteLanguage('pt')" class="lang-btn" id="lang-pt-btn">🇧🇷 PT</button>
    <span class="lang-divider">|</span>
    <button onclick="changeSiteLanguage('en')" class="lang-btn" id="lang-en-btn">🇺🇸 EN</button>
  </div>

  <!-- Elemento Oculto do Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'pt',
        includedLanguages: 'en,pt',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function changeSiteLanguage(lang) {
      var domain = location.hostname;
      if (lang === 'pt') {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + domain + "; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + domain + "; path=/;";
      } else {
        document.cookie = "googtrans=/pt/" + lang + "; path=/;";
        document.cookie = "googtrans=/pt/" + lang + "; domain=" + domain + "; path=/;";
        document.cookie = "googtrans=/pt/" + lang + "; domain=." + domain + "; path=/;";
      }
      location.reload();
    }

    // Destacar o botão ativo
    document.addEventListener("DOMContentLoaded", function() {
      var cookies = document.cookie;
      var ptBtn = document.getElementById("lang-pt-btn");
      var enBtn = document.getElementById("lang-en-btn");
      if (cookies.indexOf("googtrans=/pt/en") !== -1) {
        if (enBtn) enBtn.classList.add("active");
      } else {
        if (ptBtn) ptBtn.classList.add("active");
      }
    });
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  {{ super() }}
{% endblock %}
